[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openstride"
version = "0.1.0"
description = "Compatible with Strava: club activities, members and admins for Python, plus stravalib's full API client. Unofficial."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "choonyongchan" }]
keywords = ["strava", "club", "running", "cycling", "fitness", "stravalib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "stravalib>=2.6,<3",
    "pydantic>=2.0,<3",
    "playwright>=1.45",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
openstride = "openstride.cli:main"

[project.urls]
Source = "https://github.com/choonyongchan/OpenStride"

[tool.hatch.build.targets.wheel]

[tool.hatch.build.targets.wheel.force-include]
# src/ is the openstride package itself
"src" = "openstride"

[tool.hatch.build.targets.sdist]
include = ["src", "tests/library", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits strava.com with a saved session (opt in with --live)",
    "e2e: real headless Chromium against a local fake site (needs `playwright install chromium`)",
]

[tool.coverage.run]
source = ["openstride", "dashboard"]
omit = ["tests/*"]

[tool.coverage.paths]
openstride = ["src", "*/site-packages/openstride"]

[tool.coverage.report]
show_missing = true
skip_covered = true
