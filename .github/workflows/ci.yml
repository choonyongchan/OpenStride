name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite.name }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        suite:
          - { name: unit, path: tests/library, cov: openstride, min: 90, browser: false }
          - { name: integration, path: tests/dashboard, cov: dashboard, min: 90, browser: false }
          - { name: e2e, path: tests/e2e, cov: ".", min: 75, browser: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[test]" -r requirements-dashboard.txt httpx
      - if: matrix.suite.browser
        run: python -m playwright install --with-deps chromium
      - name: pytest
        run: >
          python -m pytest ${{ matrix.suite.path }} -q
          --cov=${{ matrix.suite.cov == '.' && 'openstride --cov=dashboard' || matrix.suite.cov }}
          --cov-report=xml --cov-report=term --cov-fail-under=${{ matrix.suite.min }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: matrix.python == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.suite.name }}
          fail_ci_if_error: false
